# AMIO Manifest: Zarr v3 Backend Configuration (NCZarr mode)
#
# This manifest configures AMIO to use the Zarr v3 backend driver
# in NCZarr fallback mode for writing ocean model output.

amio:
  version: "0.1.0"

  # Staging pool configuration
  staging:
    buffer_count: 4
    buffer_size_bytes: 20971520   # 20 MiB per buffer

  # Worker pool configuration
  workers:
    thread_count: 2
    pin_threads: false

  # Backend driver selection
  backend:
    name: "zarr3"
    options:
      mode: "nczarr"             # Use NCZarr fallback (netCDF-c)
      compression:
        algorithm: "zstd"
        level: 3
      chunking:
        auto: true

  # Dataset output path
  output:
    path: "output_zarr.zarr"
    overwrite: true

# ===================================================================
# CF / UGRID conventions and per-variable attributes
#
# The Zarr backend writes the same CF/UGRID metadata as NetCDF: the
# global `Conventions` plus `global_attributes` become Zarr group
# attributes (.zattrs in NCZarr mode / zarr.json attributes in
# TensorStore mode), and each `variables.<name>.attributes` block
# becomes that array's attributes.
#
# This example describes an unstructured (UGRID) mesh, so the
# Conventions string is upgraded to include UGRID-1.0.
# ===================================================================
conventions: "CF-1.10 UGRID-1.0"

global_attributes:
  title: "AMIO ocean model output"
  institution: "NOAA/NWS"

variables:
  # The UGRID mesh-topology dummy variable.
  mesh:
    attributes:
      cf_role: "mesh_topology"
      long_name: "Topology data of 2D unstructured mesh"
      topology_dimension: 2
      node_coordinates: "mesh_node_lon mesh_node_lat"
      face_node_connectivity: "mesh_face_nodes"
  # A data variable living on mesh faces.
  sea_surface_height:
    attributes:
      units: "m"
      long_name: "Sea Surface Height"
      standard_name: "sea_surface_height_above_geoid"
      mesh: "mesh"
      location: "face"
      _FillValue: -9999.0
